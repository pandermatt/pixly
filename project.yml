name: Pixly
options:
  bundleIdPrefix: ch.pandermatt
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  fileTypes:
    icon:
      file: true
      buildPhase: resources
settings:
  base:
    DEVELOPMENT_TEAM: 692NM4E836
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Pixly:
    type: application
    platform: iOS
    sources:
      - path: Pixly
    entitlements:
      path: Pixly/Pixly.entitlements
      properties:
        com.apple.developer.game-center: true
    info:
      path: Pixly/Info.plist
      properties:
        CFBundleDisplayName: Pixly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        CADisableMinimumFrameDurationOnPhone: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.pandermatt.pixly
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Phosphor AppIcon-Amber AppIcon-Light
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PixlyMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Pixly
        excludes:
          - Info.plist
          - Pixly.entitlements
          - AppIcon-*.icon
          - AppIcon-*.icon/**
      - path: PixlyMac/DockIcons
    entitlements:
      path: PixlyMac/PixlyMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.game-center: true
    info:
      path: PixlyMac/Info.plist
      properties:
        CFBundleDisplayName: Pixly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.arcade-games
        NSHumanReadableCopyright: © Pascal Andermatt, Jan Huber, Adrian Schrempp
    settings:
      base:
        PRODUCT_NAME: Pixly
        PRODUCT_BUNDLE_IDENTIFIER: ch.pandermatt.pixly
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
  PixlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PixlyTests
    dependencies:
      - target: Pixly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.pandermatt.pixly.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Pixly:
    build:
      targets:
        Pixly: all
        PixlyTests: [test]
    test:
      targets:
        - PixlyTests
  PixlyMac:
    build:
      targets:
        PixlyMac: all
