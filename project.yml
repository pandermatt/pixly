name: Pixly
options:
  bundleIdPrefix: ch.pandermatt
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  fileTypes:
    icon:
      file: true
      buildPhase: resources
settings:
  base:
    DEVELOPMENT_TEAM: 692NM4E836
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Pixly:
    type: application
    platform: iOS
    sources:
      - path: Pixly
    dependencies:
      # The watch app ships inside the iPhone app.
      - target: PixlyWatch
    entitlements:
      path: Pixly/Pixly.entitlements
      properties:
        com.apple.developer.game-center: true
    info:
      path: Pixly/Info.plist
      properties:
        CFBundleDisplayName: Pixly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        CADisableMinimumFrameDurationOnPhone: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        GCSupportsControllerUserInteraction: true
        GCSupportsGameMode: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.pandermatt.pixly
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Phosphor AppIcon-Amber AppIcon-Light
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PixlyMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Pixly
        excludes:
          - Info.plist
          - Pixly.entitlements
          - AppIcon-*.icon
          - AppIcon-*.icon/**
      - path: PixlyMac/DockIcons
    entitlements:
      path: PixlyMac/PixlyMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.game-center: true
    info:
      path: PixlyMac/Info.plist
      properties:
        CFBundleDisplayName: Pixly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.arcade-games
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        GCSupportsControllerUserInteraction: true
        GCSupportsGameMode: true
        NSHumanReadableCopyright: © Pascal Andermatt, Jan Huber, Adrian Schrempp
    settings:
      base:
        PRODUCT_NAME: Pixly
        PRODUCT_BUNDLE_IDENTIFIER: ch.pandermatt.pixly
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
  PixlyTV:
    type: application
    platform: tvOS
    deploymentTarget: "26.0"
    sources:
      - path: Pixly
        excludes:
          - Info.plist
          - Pixly.entitlements
          - AppIcon-*.icon
          - AppIcon-*.icon/**
          - AppIcon.icon
          - AppIcon.icon/**
      # tvOS icons are layered image stacks, not Icon Composer icons.
      - path: PixlyTV/Assets.xcassets
    entitlements:
      path: PixlyTV/PixlyTV.entitlements
      properties:
        com.apple.developer.game-center: true
    info:
      path: PixlyTV/Info.plist
      properties:
        CFBundleDisplayName: Pixly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: MicroGamepad
        GCSupportsControllerUserInteraction: true
    settings:
      base:
        PRODUCT_NAME: Pixly
        PRODUCT_BUNDLE_IDENTIFIER: ch.pandermatt.pixly
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PixlyTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: "26.0"
    sources:
      - path: PixlyTVUITests
    dependencies:
      - target: PixlyTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.pandermatt.pixly.tvuitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PixlyTV
  PixlyWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: PixlyWatch
        excludes:
          - Info.plist
          - PixlyWatch.entitlements
      # Only the classic game: the engine, the console and what the score needs.
      - Pixly/AppIcon.icon
      - Pixly/Assets.xcassets
      - Pixly/Console/ConsoleBuffer.swift
      - Pixly/Console/ConsoleView.swift
      - Pixly/GameCenter/Achievement.swift
      - Pixly/GameCenter/GameCenterManager.swift
      - Pixly/Program/Avatar.swift
      - Pixly/Program/PixelEscapeGame.swift
      - Pixly/Program/QuickGame.swift
      - Pixly/Program/ScoreStore.swift
      - Pixly/Program/TunnelDrawing.swift
      - Pixly/Support/AppIconSwitcher.swift
      - Pixly/Support/PixlyTheme.swift
      - Pixly/Support/Preferences.swift
      - Pixly/Support/SeededGenerator.swift
      - Pixly/Support/Theme.swift
      - Pixly/Support/WatchSync.swift
    entitlements:
      path: PixlyWatch/PixlyWatch.entitlements
      properties:
        com.apple.developer.game-center: true
    info:
      path: PixlyWatch/Info.plist
      properties:
        CFBundleDisplayName: Pixly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: ch.pandermatt.pixly
        WKRunsIndependentlyOfCompanionApp: true
    settings:
      base:
        PRODUCT_NAME: Pixly
        PRODUCT_BUNDLE_IDENTIFIER: ch.pandermatt.pixly.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PixlyWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: PixlyWatchUITests
    dependencies:
      - target: PixlyWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.pandermatt.pixly.watchuitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PixlyWatch
  PixlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PixlyTests
    dependencies:
      - target: Pixly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.pandermatt.pixly.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Pixly:
    build:
      targets:
        Pixly: all
        PixlyTests: [test]
    test:
      targets:
        - PixlyTests
  PixlyMac:
    build:
      targets:
        PixlyMac: all
  PixlyTV:
    build:
      targets:
        PixlyTV: all
        PixlyTVUITests: [test]
    test:
      targets:
        - PixlyTVUITests
  PixlyWatch:
    build:
      targets:
        PixlyWatch: all
        PixlyWatchUITests: [test]
    test:
      targets:
        - PixlyWatchUITests
